[package]
name = "rust-md-editor"
version = "1.0.4"
edition = "2021"
description = "Lightweight desktop Markdown editor with incremental preview (egui)"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
