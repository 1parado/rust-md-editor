[package]
name = "rust-md-editor"
version = "0.5.0"
edition = "2021"
description = "Lightweight terminal Markdown editor with incremental preview, syntax highlighting, and scroll sync"
license = "MIT"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
unicode-width = "0.2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
